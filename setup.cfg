[tool:pytest]
# Put the repository root on sys.path so `service` and `tests` are importable
# when pytest is invoked directly (`pytest ...`), matching the CI invocation.
pythonpath = .
testpaths = tests

[flake8]
max-line-length = 127
exclude = .git,__pycache__,venv,env
ignore = E501

[pylint]
max-line-length = 127
disable = C0114,C0115,C0116

[coverage:run]
source = service
omit = 
    service/common/status.py
    service/__init__.py

[coverage:report]
show_missing = True
