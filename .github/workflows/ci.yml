name: CI Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    # The service takes its database from DATABASE_URI.  CI points it at a
    # throwaway SQLite file, so the job needs no database service to start or
    # wait for and no credentials to seed.
    #
    # Flask-Talisman redirects plain HTTP to HTTPS by default (correct behind
    # the TLS-terminating proxy used in deployment).  The BDD scenarios speak
    # plain HTTP, so the redirect is switched off for this job; the security
    # headers themselves stay enabled.
    env:
      DATABASE_URI: sqlite:///test.db
      FORCE_HTTPS: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pinned: `ubuntu-latest` now ships 3.12+, and the tooling below is
          # verified against this exact version.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # `nosetests` and its --with-spec/--spec-color plugins have not worked on
      # Python 3.10+, so the unit tests now run under pytest.  Coverage of the
      # service package is still reported (`--cov=service`).
      - name: Run unit tests
        run: pytest -v --cov=service --cov-report=term-missing

      # `behave` runs every scenario EXCEPT those tagged @ui.
      #
      # The single @ui scenario (features/products.feature) drives a real
      # browser against a "Home Page" this repository does not ship: there is
      # no templates/ or static/ directory, so none of the element ids the
      # scenario uses exist, and this job installs no Chrome/chromedriver.
      # It is deliberately kept in the suite and excluded by an explicit tag
      # rather than deleted or silenced with `|| true`, so the gap stays
      # visible; run it locally with `behave --tags=@ui` once a front-end
      # exists.
      #
      # What CI DOES exercise here is features/api.feature: five scenarios that
      # drive the real service over HTTP (list, filter by name/category/
      # availability, and retrieve by id), so this step is not a no-op.
      - name: Run BDD tests
        run: behave --tags="not @ui"
